<div class="screen active" id="screen-pedidos">
  <div class="page-header">
    <div class="page-title">Lista de Pedidos</div>
  </div>

  <p *ngIf="carregando" style="color:white; padding:20px;">Carregando...</p>
  <p *ngIf="erro" style="color:#e74c3c; padding:20px;">{{ erro }}</p>
  <p *ngIf="sucesso" style="color:#39ff14; padding:20px; font-weight:600;">✓ {{ sucesso }}</p>

  <div class="card">
    <div class="tbl-wrap">
      <table>
        <thead>
          <tr>
            <th>ID Pedido</th>
            <th>Cliente</th>
            <th>Data</th>
            <th>Total</th>
            <th>Status</th>
            <th>Alterar Status</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let pedido of pedidos">
            <td>#{{ pedido.id }}</td>
            <td>{{ pedido.usuario?.nome }} {{ pedido.usuario?.sobrenome }}</td>
            <td>{{ pedido.createdAt | date:'dd/MM/yyyy' }}</td>
            <td>R$ {{ pedido.total }}</td>
            <td>
              <span class="status"
                [class.delivered]="pedido.status === 'ENTREGUE'"
                [class.canceled]="pedido.status === 'CANCELADO'"
                [class.pending]="pedido.status === 'PENDENTE'">
                {{ pedido.status }}
              </span>
            </td>
            <td>
              <select (change)="atualizarStatus(pedido, $any($event.target).value)">
                <option value="">Alterar</option>
                <option value="PENDENTE">Pendente</option>
                <option value="PAGO">Pago</option>
                <option value="ENVIADO">Enviado</option>
                <option value="ENTREGUE">Entregue</option>
                <option value="CANCELADO">Cancelado</option>
              </select>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
