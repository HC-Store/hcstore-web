<div class="page">
  <h2>Adicionar Produto</h2>

  <div class="container">
    <div class="form-card">

      <p class="sucesso-msg" *ngIf="sucesso">✓ {{ sucesso }}</p>
      <p class="erro-msg" *ngIf="erro">{{ erro }}</p>

      <label>Nome do Produto</label>
      <input [(ngModel)]="produto.nome" placeholder="Digite o nome aqui" />

      <label>Descrição</label>
      <textarea [(ngModel)]="produto.descricao" placeholder="Digite a descrição aqui"></textarea>

      <label>Categoria</label>
      <select [(ngModel)]="produto.categoriaId">
        <option [value]="null" disabled>Selecione uma categoria</option>
        <option *ngFor="let cat of categorias" [value]="cat.id">{{ cat.nome }}</option>
      </select>

      <label>Marca</label>
      <input [(ngModel)]="produto.marca" placeholder="Ex: Nike, Adidas" />

      <label>Tamanho - clique para selecionar</label>
      <div class="sizes">
        <span *ngFor="let s of sizes" (click)="toggleSize(s)" [class.active]="selectedSizes.includes(s)">
          {{ s }}
        </span>
      </div>

      <label>Quantidade no Estoque</label>
      <input type="number" [(ngModel)]="produto.estoque" placeholder="Ex: 100" />

      <label>Preço</label>
      <input type="number" [(ngModel)]="produto.preco" placeholder="Ex: 189.90" />

      <!-- UPLOAD DE IMAGEM -->
      <label>Imagem do Produto</label>
      <div class="upload-area" (click)="fileInput.click()">
        <input
          #fileInput
          type="file"
          hidden
          accept="image/*"
          (change)="onImageSelected($event)"
        />
        <div *ngIf="!produto.imagem && !uploadando" class="upload-placeholder">
          <span>📷 Clique para selecionar uma imagem</span>
        </div>
        <div *ngIf="uploadando" class="upload-placeholder">
          <span>Enviando imagem...</span>
        </div>
        <img
          *ngIf="produto.imagem && !uploadando"
          [src]="produto.imagem"
          alt="Preview"
          style="max-width: 100%; max-height: 200px; border-radius: 8px;"
        />
      </div>

      <!-- URL MANUAL (fallback) -->
      <label style="margin-top: 8px;">Ou cole a URL da imagem</label>
      <input [(ngModel)]="produto.imagem" placeholder="https://res.cloudinary.com/sua-imagem.jpg" />

      <button class="btn" (click)="salvar()" [disabled]="carregando || uploadando">
        {{ carregando ? 'SALVANDO...' : 'ADICIONAR' }}
      </button>

    </div>
  </div>
</div>
