<app-header
  (openLogin)="abrirLogin()"
  (openCart)="abrirCart()"
></app-header>

<main>
  <section class="banner">
    <video autoplay muted loop playsinline class="video-banner">
      <source [src]="config.videoUrl" type="video/mp4" />
    </video>
    <div class="overlay"></div>
    <div class="texto-banner">
      <h1>Seu estilo fala antes de você.</h1>
      <button class="btn-banner" routerLink="/product-list">Explore seu estilo</button>
    </div>
  </section>

  <br />

  <section class="menu1">
    <div class="item">
      <img [src]="config.banner1" alt="Tênis" />
      <div class="overlay">
        <h3>Tênis</h3>
        <a routerLink="/product-list" [queryParams]="{ categoria: 'Tenis' }" class="explorar">Explore →</a>
      </div>
    </div>
    <div class="item">
      <img [src]="config.banner2" alt="Acessórios" />
      <div class="overlay">
        <h3>Acessórios</h3>
        <a routerLink="/product-list" [queryParams]="{ categoria: 'Acessorios' }" class="explorar">Explore →</a>
      </div>
    </div>
    <div class="item">
      <img [src]="config.banner3" alt="Roupas" />
      <div class="overlay">
        <h3>Roupas</h3>
        <a routerLink="/product-list" class="explorar">Explore →</a>
      </div>
    </div>
  </section>

  <section class="menu2">
    <div class="topo">
      <div>
        <h3 class="drop">Drops Selecionados</h3>
        <h1 class="text_inspire">Inspire-se</h1>
      </div>
      <a routerLink="/product-list" class="text_conferir text_conferir_light">CONFERIR →</a>
    </div>
    <div class="grid">
      <div class="item2" *ngFor="let d of config.destaques">
        <a [routerLink]="['/product-detail', d.id]">
          <img [src]="d.imagem" [alt]="d.titulo" />
        </a>
        <p class="desc"><strong>{{ d.titulo }}</strong></p>
      </div>
    </div>
  </section>

  <section class="menu3">
    <div class="topo2">
      <div>
        <h2 class="novidades">Novidades</h2>
        <h1 class="lancamentos">Últimos lançamentos</h1>
      </div>
      <a routerLink="/product-list" class="text_conferir text_conferir_dark">CONFERIR →</a>
    </div>
    <div class="grid2">
      <div class="item3" *ngFor="let l of config.lancamentos">
        <a [routerLink]="['/product-detail', l.id]">
          <img [src]="l.imagem" [alt]="l.titulo" />
        </a>
      </div>
    </div>
  </section>
</main>

<app-footer></app-footer>
<app-modals [modalAberto]="modalAberto" (closeModal)="fecharModal()"></app-modals>
