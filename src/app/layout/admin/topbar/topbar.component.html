<div class="topbar">

  <div class="left">
    <span class="breadcrumb">
      Home <span class="sep">/</span> <span class="active">{{ currentPage }}</span>
    </span>
  </div>

  <div class="right">
    <input *ngIf="showSearch"
           [(ngModel)]="searchTerm"
           (keyup.enter)="search()"
           class="search-input"
           placeholder="Buscar produtos..."
           aria-label="Buscar produtos" />

    <button type="button" class="icon-btn" (click)="toggleSearch()" aria-label="Buscar">
      <svg class="icn" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    </button>

    <!-- NOTIFICAÇÕES -->
    <div class="notif-container">
      <button type="button" class="icon-btn" (click)="toggleNotifications()" aria-label="Notificações">
        <svg class="icn" viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0c0 7 2 8 2 8H4s2-1 2-8M10 21h4"/></svg>
      </button>
      <span class="badge" *ngIf="unreadCount">{{ unreadCount }}</span>

      <div class="dropdown notif-dropdown" *ngIf="showNotifications">
        <div class="notif-title">
          <span>Notificações</span>
          <button type="button" class="notif-read-all" *ngIf="unreadCount" (click)="marcarTodasComoLidas()">Marcar como lidas</button>
        </div>

        <div class="notif-list">

        <div *ngFor="let n of notifications"
             class="notif-item"
             [class.unread]="!n.read"
             (click)="abrirNotificacao(n)">
          {{ n.text }}
        </div>

        <div *ngIf="notifications.length === 0" class="empty">
          Nenhuma notificação
        </div>
        </div>
      </div>
    </div>

    <!-- ADMIN -->
    <div class="admin-container">

      <button type="button" class="admin" (click)="toggleAdminMenu()">
        <span class="admin-avatar">A</span>
        <span class="admin-label">Admin</span>
        <svg class="icn chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
      </button>

      <div class="dropdown admin-dropdown" *ngIf="showAdminMenu">
        <div class="admin-item">Perfil</div>
        <div class="admin-item logout" (click)="logout()">Sair</div>
      </div>

    </div>

  </div>

</div>
