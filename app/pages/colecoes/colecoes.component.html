<app-header (openLogin)="abrirLogin()" (openCart)="abrirCart()"></app-header>

<main class="colecoes-page">
  <section class="launch-top">
    <p class="launch-label">Próximo lançamento</p>
    <h1 class="launch-title">{{ config.dropTitulo }}</h1>
    <h2 class="launch-subtitle">{{ config.dropSubtitulo }}</h2>

    <div class="countdown">
      <div class="time-box"><strong>{{ meses }}</strong><span>Meses</span></div>
      <div class="time-box"><strong>{{ dias }}</strong><span>Dias</span></div>
      <div class="time-box"><strong>{{ horas }}</strong><span>Horas</span></div>
      <div class="time-box"><strong>{{ minutos }}</strong><span>Min</span></div>
      <div class="time-box"><strong>{{ segundos }}</strong><span>Secs</span></div>
    </div>
  </section>

  <section class="launch-bottom">
    <div class="product-image">
      <img [src]="config.bannerImagem" alt="Produto do drop" />
    </div>
    <div class="product-info">
      <h3>O Conceito</h3>
      <p>{{ config.dropDescricao }}</p>
      <a routerLink="/product-list" class="cta-button">CONFERIR <span>→</span></a>
    </div>
  </section>
</main>

<app-footer></app-footer>
<app-modals [modalAberto]="modalAberto" (closeModal)="fecharModal()"></app-modals>
