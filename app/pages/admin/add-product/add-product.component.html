<div class="page">
  <h2>Adicionar Produto</h2>

  <div class="container">
    <div class="form-card">

      <!-- ALERTAS -->
      <p class="sucesso-msg" *ngIf="sucesso">
        ✓ {{ sucesso }}
      </p>

      <p class="erro-msg" *ngIf="erro">
        {{ erro }}
      </p>

      <!-- NOME -->
      <label>Nome do Produto</label>
      <input
        type="text"
        [(ngModel)]="produto.nome"
        placeholder="Digite o nome aqui"
      />

      <!-- DESCRIÇÃO -->
      <label>Descrição</label>
      <textarea
        [(ngModel)]="produto.descricao"
        placeholder="Digite a descrição aqui"
      ></textarea>

      <!-- CATEGORIA -->
      <label>Categoria</label>

      <select [(ngModel)]="produto.categoria">
        <option value="" disabled>
          Selecione uma categoria
        </option>

        <option value="Casual">Casual</option>
        <option value="Streetwear">Streetwear</option>
        <option value="Camisetas">Camisetas</option>
        <option value="Bermudas & Shorts">Bermudas & Shorts</option>
        <option value="Conjuntos">Conjuntos</option>
        <option value="Calças">Calças</option>
        <option value="Moletons">Moletons</option>
        <option value="Chinelos">Chinelos</option>
        <option value="Tênis">Tênis</option>
        <option value="Acessórios">Acessórios</option>
      </select>

      <!-- MARCA -->
      <label>Marca</label>
      <input
        type="text"
        [(ngModel)]="produto.marca"
        placeholder="Ex: Nike, Adidas"
      />

      <!-- TAMANHOS -->
      <label>Tamanho - clique para selecionar</label>

      <div class="sizes">
        <span
          *ngFor="let s of sizes"
          (click)="toggleSize(s)"
          [class.active]="selectedSizes.includes(s)"
        >
          {{ s }}
        </span>
      </div>

      <!-- QUANTIDADE POR TAMANHO -->
      <div
        class="estoque-tamanhos"
        *ngIf="estoquePorTamanho.length > 0"
      >

        <h3>Quantidade por tamanho</h3>

        <div
          class="estoque-tamanho-item"
          *ngFor="let item of estoquePorTamanho"
        >

          <span class="tamanho-label">
            {{ item.tamanho }}
          </span>

          <input
            type="number"
            min="0"
            [(ngModel)]="item.quantidade"
            placeholder="Quantidade"
          />

        </div>

      </div>

      <!-- ESTOQUE TOTAL -->
      <label>Quantidade Total no Estoque</label>

      <input
        type="number"
        [value]="estoqueTotal"
        readonly
        placeholder="Calculado automaticamente"
      />

      <!-- PREÇO -->
      <label>Preço</label>

      <input
        type="number"
        [(ngModel)]="produto.preco"
        placeholder="Ex: 189.90"
      />

      <!-- UPLOAD -->
      <label>Imagem do Produto</label>

      <div
        class="upload-area"
        (click)="fileInput.click()"
      >

        <input
          #fileInput
          type="file"
          hidden
          accept="image/*"
          (change)="onImageSelected($event)"
        />

        <div
          *ngIf="!produto.imagem && !uploadando"
          class="upload-placeholder"
        >
          <span>
            📷 Clique para selecionar uma imagem
          </span>
        </div>

        <div
          *ngIf="uploadando"
          class="upload-placeholder"
        >
          <span>
            Enviando imagem...
          </span>
        </div>

        <img
          *ngIf="produto.imagem && !uploadando"
          [src]="produto.imagem"
          alt="Preview"
          class="preview-img"
        />

      </div>

      <!-- URL -->
      <label>Ou cole a URL da imagem</label>

      <input
        type="text"
        [(ngModel)]="produto.imagem"
        placeholder="https://res.cloudinary.com/..."
      />

      <!-- BOTÃO -->
      <button
        class="btn"
        (click)="salvar()"
        [disabled]="carregando || uploadando"
      >
        {{ carregando ? 'SALVANDO...' : 'ADICIONAR' }}
      </button>

    </div>
  </div>
</div>
